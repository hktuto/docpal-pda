# Production stack: db + backend + web (PDA) + admin console.
# Separate compose project ("warehouse-prod") so it can coexist with the
# dev-only docker-compose.yml (db on :5432) — containers/volumes don't clash.
#
# Usage:
#   cp .env.prod.example .env.prod   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: warehouse-prod

services:
  db:
    env_file: ./.env
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse_backend}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Password for the warehouse_sync role created by the init script below.
      SYNC_DB_PASSWORD: ${SYNC_DB_PASSWORD:-warehouse_sync}
    # Not published to the host — only the backend talks to it. Add a ports
    # mapping here if you need external DB access.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First container init only (empty data dir): create the warehouse_sync
      # role. Migration 0010 repeats it idempotently for existing volumes.
      - ./scripts/sql/create-sync-role.sh:/docker-entrypoint-initdb.d/00-create-sync-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    env_file: ./.env
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-warehouse_backend}
      PORT: 3002
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.prod}
      # Browser origins allowed to call the API. Defaults to * (allow all) —
      # the web host serving the PDA can be any LAN name/IP, and auth is a
      # Bearer header, not cookies. Set CORS_ORIGINS to a comma-separated
      # allowlist to restrict.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DEV_ROUTES: off
      # Demo dataset auto-seeds on first boot (empty users table). Change the
      # demo passwords, or set WAREHOUSE_SEED=off once real users exist.
      WAREHOUSE_SEED: ${WAREHOUSE_SEED:-on}
      # Demo receiving/picking ORDERS are skipped by default on a fresh prod
      # database (master data + shelf stock only); set WAREHOUSE_SEED_ORDERS=on
      # to include the demo orders.
      WAREHOUSE_SEED_ORDERS: ${WAREHOUSE_SEED_ORDERS:-off}
      # Optional: delegate login to the DocPal API (e.g.
      # https://uat.docpal.weltronics.com/api). When set, local passwords are
      # ignored — DocPal verifies credentials and local users are
      # auto-provisioned. Spec: docs/superpowers/specs/2026-08-13-docpal-auth-design.md
      DOCPAL_URL: ${DOCPAL_URL:-}
      # Optional flow config override (JSON merged over defaults), e.g.
      # '{"steps":{"picking":{"allocation":{"allowDockStock":false}}}}' to make
      # put-away a hard gate before picking allocation. The primary source is
      # the warehouse_config row "flow" (edit the seed for fresh DBs, or SQL
      # UPDATE + backend restart for existing ones). Deprecated comma-separated
      # step kill-switch (e.g. "measuring,verify") still applies when FLOW_CONFIG is unset.
      FLOW_CONFIG: ${FLOW_CONFIG:-}
      FLOW_STEPS_DISABLED: ${FLOW_STEPS_DISABLED:-}
    # Published release APK + version.json (built by `pnpm build:apk`),
    # served via GET /admin/app-download/file.
    volumes:
      - ./apps/backend/public/apk:/app/public/apk:ro
    ports:
      - "9002:3002"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    env_file: ./.env
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 3103
      # API origin as seen from the PDA browser/WebView (public runtime config,
      # applied at container start — no rebuild needed).
      NUXT_PUBLIC_API_BASE_URL: ${WEB_API_BASE_URL:-${PRODUCTION_URL}:9002}
    ports:
      - "3000:3103"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      PORT: 3100
      NUXT_PUBLIC_API_BASE_URL: ${ADMIN_API_BASE_URL:-${PRODUCTION_URL}:9002}
    ports:
      - "80:3100"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
