<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Warehouse PDA — 維護中</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: linear-gradient(160deg, #0d9488, #1d4ed8); padding: 1.5rem;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 2rem 1.5rem; width: 100%; max-width: 420px;
    box-shadow: 0 12px 32px rgba(0,0,0,.25); text-align: center;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; color: #111827; }
  p { color: #4b5563; font-size: .95rem; line-height: 1.5; margin: .25rem 0 1rem; }
  .url { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; color: #6b7280; word-break: break-all; }
  button {
    width: 100%; padding: .8rem; border: none; border-radius: 999px; font-size: 1rem; cursor: pointer;
    background: #0d9488; color: #fff; font-weight: 600;
  }
  .status { margin-top: .75rem; font-size: .8rem; color: #9ca3af; min-height: 1em; }
</style>
</head>
<body>
  <div class="card">
    <h1>系統暫時無法連線</h1>
    <p>無法連到 Warehouse PDA 伺服器，可能正在維護或尚未啟動。請按「立即重試」重新連線。</p>
    <p class="url" id="target"></p>
    <button id="retry">立即重試</button>
    <div class="status" id="status"></div>
  </div>

<script>
(function () {
  // Dev default — production APK builds (scripts/build-android-apk.mjs) rewrite
  // this line to the app URL (PRODUCTION_URL + :3000) after `nuxt generate`.
  // This is the ONLY URL this page may retry: the Capacitor bridge is injected
  // for the configured server.url origin alone, so navigating the WebView to
  // any other host would kill the native plugins (hardware scanning).
  var DEFAULT_URL = 'http://localhost:3103';

  document.getElementById('target').textContent = DEFAULT_URL;
  document.getElementById('retry').addEventListener('click', function () {
    document.getElementById('status').textContent = '連線中…';
    window.location.href = DEFAULT_URL;
  });
})();
</script>
</body>
</html>
